name: Daily Streak Reminder Emails

on:
  schedule:
    # Run every hour to catch users in different time zones at their 10:00 AM
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-streak-reminders:
    name: Send Streak Reminder Emails
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npx tsc scripts/send-streak-reminders.ts --outDir dist --module commonjs --target es2020 --moduleResolution node --esModuleInterop

      - name: Send streak reminder emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_HOUR_LOCAL: '10'
          BATCH_SIZE: '100'
          BATCH_DELAY_MS: '2000'
        run: node dist/send-streak-reminders.js

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-job-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7
          if-no-files-found: ignore
           
